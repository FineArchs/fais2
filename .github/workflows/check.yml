name: Check (Typecheck & Test & Lint)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix:
        command:
          - typecheck
          - test
          - lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun ci

      - name: Build
        run: bun run build

      - name: ${{ matrix.command }}
        run: bun run ${{ matrix.command }}
